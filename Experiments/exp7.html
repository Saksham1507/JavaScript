<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List with Stats counter</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4a90e2;
            --edit-color: #f39c12;
            --delete-color: #e74c3c;
            --border-color: #e0e0e0;
            --done-color: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .todo-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 480px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #2c3e50;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        #add-btn {
            background-color: var(--primary-color);
            color: white;
        }

        #add-btn:hover {
            background-color: #357abd;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 350px;
            overflow-y: auto;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 10px;
            gap: 12px;
            transition: opacity 0.2s, background-color 0.2s;
        }

        li.completed-row {
            background-color: #f0fbf5;
            border-color: #c2eed5;
        }

        .task-left-section {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .done-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--done-color);
        }

        .task-text {
            flex: 1;
            word-break: break-word;
            font-size: 16px;
            transition: color 0.2s;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #7f8c8d;
        }

        .edit-input {
            flex: 1;
            padding: 8px;
            font-size: 16px;
            border: 1px solid var(--edit-color);
            border-radius: 4px;
        }

        .action-btns {
            display: flex;
            gap: 5px;
        }

        .edit-btn {
            background-color: var(--edit-color);
            color: white;
        }

        .edit-btn:hover {
            background-color: #d35400;
        }

        .delete-btn {
            background-color: var(--delete-color);
            color: white;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        /* NEW: Stats Summary Counter Styling */
        .todo-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid var(--bg-color);
            font-size: 14px;
            color: #555555;
            font-weight: 500;
        }

        .stat-item span {
            font-weight: 700;
            color: #2c3e50;
        }
       
        .stat-item.done-count span {
            color: var(--done-color);
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <h2>24070521151</h2>
       
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off">
            <button id="add-btn">Add Task</button>
        </div>

        <ul id="todo-list"></ul>

        <!-- NEW: Total tasks dashboard counter option section -->
        <div class="todo-summary">
            <div class="stat-item">Total Tasks: <span id="total-count">0</span></div>
            <div class="stat-item">Pending: <span id="pending-count">0</span></div>
            <div class="stat-item done-count">Completed: <span id="completed-count">0</span></div>
        </div>
    </div>

    <script>
        const todoInput = document.getElementById('todo-input');
        const addBtn = document.getElementById('add-btn');
        const todoList = document.getElementById('todo-list');
       
        // Counter Elements
        const totalCountEl = document.getElementById('total-count');
        const pendingCountEl = document.getElementById('pending-count');
        const completedCountEl = document.getElementById('completed-count');

        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // NEW: Updates counts at the bottom bar layout element
        function updateSummaryCounters() {
            const total = tasks.length;
            const completed = tasks.filter(task => task.completed).length;
            const pending = total - completed;

            totalCountEl.textContent = total;
            pendingCountEl.textContent = pending;
            completedCountEl.textContent = completed;
        }

        function renderTasks() {
            todoList.innerHTML = '';
           
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
               
                if (task.completed) {
                    li.classList.add('completed-row');
                }

                if (task.isEditing) {
                    li.innerHTML = `
                        <input type="text" class="edit-input" value="${task.text}" id="edit-input-${index}">
                        <div class="action-btns">
                            <button class="edit-btn" onclick="saveEdit(${index})">Save</button>
                            <button class="delete-btn" onclick="toggleEdit(${index})">Cancel</button>
                        </div>
                    `;
                } else {
                    li.innerHTML = `
                        <div class="task-left-section">
                            <input
                                type="checkbox"
                                class="done-checkbox"
                                ${task.completed ? 'checked' : ''}
                                onclick="toggleComplete(${index})"
                                title="Mark as Done"
                            >
                            <span class="task-text ${task.completed ? 'completed' : ''}">
                                ${task.text}
                            </span>
                        </div>
                        <div class="action-btns">
                            <button class="edit-btn" onclick="toggleEdit(${index})">Modify</button>
                            <button class="delete-btn" onclick="deleteTask(${index})">Delete</button>
                        </div>
                    `;
                }

                todoList.appendChild(li);
            });

            // Re-calculate statistics layout figures every render cycle
            updateSummaryCounters();
        }

        function addTask() {
            const taskText = todoInput.value.trim();
            if (taskText === '') return;

            tasks.push({
                text: taskText,
                completed: false,
                isEditing: false
            });

            todoInput.value = '';
            saveTasks();
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        function toggleEdit(index) {
            tasks[index].isEditing = !tasks[index].isEditing;
            renderTasks();
        }

        function saveEdit(index) {
            const editInput = document.getElementById(`edit-input-${index}`);
            const updatedText = editInput.value.trim();
           
            if (updatedText !== '') {
                tasks[index].text = updatedText;
                tasks[index].isEditing = false;
                saveTasks();
                renderTasks();
            }
        }

        function toggleComplete(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        addBtn.addEventListener('click', addTask);
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        renderTasks();
    </script>

</body>
</html>
