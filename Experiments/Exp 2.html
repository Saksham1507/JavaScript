<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing System</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 30px;
    }

    .container {
      width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    .student-info {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }

    input {
      padding: 9px;
      margin: 5px;
      border: 1px solid #aaa;
      border-radius: 4px;
      width: 27%;
    }

    button {
      padding: 9px 15px;
      background: #3949ab;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #283593;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #3949ab;
      color: white;
    }

    .remove-btn {
      background: #e53935;
      padding: 5px 8px;
    }

    .total {
      text-align: right;
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Billing System</h2>

  <div class="student-info">
    <b>Name:</b> Saksham Chimdyalwar <br>
    <b>PRN:</b> 24070521151
  </div>

  <!-- Item Input -->

  <input type="text" id="itemName" placeholder="Item Name">

  <input type="number" id="itemPrice" placeholder="Price">

  <input type="number" id="itemQty" placeholder="Quantity">

  <button onclick="addItem()">Add Item</button>


  <!-- Bill Table -->

  <table>

    <thead>
      <tr>
        <th>Item</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Amount</th>
        <th>Remove</th>
      </tr>
    </thead>

    <tbody id="billTable"></tbody>

  </table>


  <div class="total">
    Total Bill: ₹<span id="totalBill">0.00</span>
  </div>

</div>


<script>

  let items = [];


  // Add Item
  function addItem() {

    let name = document.getElementById("itemName").value;
    let price = Number(document.getElementById("itemPrice").value);
    let qty = Number(document.getElementById("itemQty").value);


    if (name == "" || price <= 0 || qty <= 0) {

      alert("Please enter valid item details!");

      return;
    }


    items.push({
      name: name,
      price: price,
      qty: qty
    });


    // Clear Inputs
    document.getElementById("itemName").value = "";
    document.getElementById("itemPrice").value = "";
    document.getElementById("itemQty").value = "";


    displayBill();
  }


  // Display Bill
  function displayBill() {

    let table = document.getElementById("billTable");

    let total = 0;

    table.innerHTML = "";


    for (let i = 0; i < items.length; i++) {

      let amount = items[i].price * items[i].qty;

      total = total + amount;


      table.innerHTML += `
        <tr>

          <td>${items[i].name}</td>

          <td>₹${items[i].price.toFixed(2)}</td>

          <td>${items[i].qty}</td>

          <td>₹${amount.toFixed(2)}</td>

          <td>
            <button class="remove-btn"
            onclick="removeItem(${i})">X</button>
          </td>

        </tr>
      `;
    }


    document.getElementById("totalBill").innerHTML =
      total.toFixed(2);
  }


  // Remove Item
  function removeItem(index) {

    items.splice(index, 1);

    displayBill();
  }

</script>

</body>
</html>
