<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      min-height: 100vh;
      background: #f2f4f7;
    }

    /* Left Section */
    .section-left {
      flex: 1;
      padding: 40px 20px;
      background: white;
      border-right: 2px solid #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Right Section */
    .section-right {
      flex: 1;
      padding: 40px 20px;
      background: #eef2ff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 100%;
      max-width: 320px;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .student-info {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 5px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #5e35b1;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #4527a0;
    }

    .error {
      color: #b71c1c;
      background: #ffcdd2;
      padding: 8px;
      border-radius: 5px;
      margin-top: 12px;
      display: none;
      text-align: center;
    }

    .placeholder {
      color: #666;
      font-size: 16px;
    }

    /* Result Box */
    .result-card {
      display: none;
      background: white;
      border: 2px solid #43a047;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      width: 260px;
    }

    .status {
      background: #c8e6c9;
      color: #1b5e20;
      padding: 5px 15px;
      border-radius: 10px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 15px;
    }

    .gpa {
      font-size: 45px;
      font-weight: bold;
      color: #5e35b1;
    }

    .label {
      color: #555;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- LEFT SIDE -->
  <div class="section-left">

    <div class="box">

      <h2>Student Result Login</h2>

      <div class="student-info">
        <b>Name:</b> Saksham Chimdyalwar<br>
        <b>PRN:</b> 24070521151
      </div>

      <form id="loginForm">

        <label>Password</label>

        <input
          type="text"
          id="passInput"
          placeholder="Enter your password"
          required
        >

        <button type="submit">View Result</button>

      </form>

      <div id="errorMsg" class="error">
        Wrong Password!
      </div>

    </div>

  </div>


  <!-- RIGHT SIDE -->
  <div class="section-right">

    <div id="placeholder" class="placeholder">
      Enter correct password to view your result
    </div>

    <div id="resultCard" class="result-card">

      <span class="status">PASS</span>

      <div class="gpa">9</div>

      <div class="label">GPA</div>

    </div>

  </div>


  <script>

    const TARGET_PASS = "Saksham1151";

    document.getElementById("loginForm").addEventListener("submit", function(e) {

      e.preventDefault();

      const inputVal =
        document.getElementById("passInput").value.trim();

      const isCorrect = (inputVal === TARGET_PASS);


      document.getElementById("errorMsg").style.display =
        isCorrect ? "none" : "block";

      document.getElementById("resultCard").style.display =
        isCorrect ? "block" : "none";

      document.getElementById("placeholder").style.display =
        isCorrect ? "none" : "block";

    });

  </script>

</body>
</html>
