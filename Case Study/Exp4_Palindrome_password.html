<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Password Strength Checker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      width: 400px;
      padding: 25px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .student-info {
      background: #f5f5f5;
      padding: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      text-align: center;
    }

    .password-box {
      display: flex;
      gap: 5px;
      margin-bottom: 12px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 5px;
      font-size: 15px;
    }

    .show-btn {
      background: #555;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 8px;
      cursor: pointer;
    }

    .check-btn {
      width: 100%;
      padding: 10px;
      background: #3949ab;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    .check-btn:hover {
      background: #283593;
    }

    #result {
      display: none;
      margin-top: 15px;
      padding: 10px;
      text-align: center;
      border-radius: 5px;
    }

    .warning {
      display: block !important;
      background: #fff3cd;
      color: #856404;
    }

    .success {
      display: block !important;
      background: #d4edda;
      color: #155724;
    }

    .error {
      display: block !important;
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Password Security Checker</h2>

    <p class="subtitle">
      Check whether your password is a palindrome
    </p>

    <div class="student-info">
      <b>Name:</b> Saksham Chimdyalwar <br>
      <b>PRN:</b> 24070521151
    </div>

    <div class="password-box">

      <input
        type="text"
        id="passwordInput"
        placeholder="Enter password"
      >

      <button class="show-btn" onclick="togglePassword()">
        Hide
      </button>

    </div>

    <button class="check-btn" onclick="checkPassword()">
      Check Password
    </button>

    <div id="result"></div>

  </div>


  <script>

    let hidden = false;

    // Show or Hide Password
    function togglePassword() {

      const input = document.getElementById("passwordInput");
      const button = document.querySelector(".show-btn");

      if (hidden == false) {

        input.type = "password";
        button.innerHTML = "Show";
        hidden = true;

      } else {

        input.type = "text";
        button.innerHTML = "Hide";
        hidden = false;

      }
    }


    // Check Password
    function checkPassword() {

      const password =
        document.getElementById("passwordInput").value;

      const result =
        document.getElementById("result");


      // Empty Password
      if (password == "") {

        result.className = "error";

        result.innerHTML =
          "Please enter a password first!";

        return;
      }


      // Reverse Password
      const reversedPassword =
        password.split("").reverse().join("");


      // Palindrome Check
      if (password === reversedPassword) {

        result.className = "warning";

        result.innerHTML =
          "<b>Weak Password!</b><br>Password is a palindrome.";

      } else {

        result.className = "success";

        result.innerHTML =
          "<b>Strong Password!</b><br>Password is not a palindrome.";

      }

    }

  </script>

</body>
</html>
